<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="t d">
  <title id="t">The core idea: mind, voice, hands, locks, journal, remote control</title>
  <desc id="d">The local model is the mind, LM Studio is the voice, OpenCode is the hands acting on your project. Permissions are door locks, Git is a safety journal, and remote pairing is a remote control.</desc>
  <defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e2e8f0}.eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#2dd4bf}.hero{font-size:46px;font-weight:700}.lead{font-size:18px;fill:#cbd5e1}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#94a3b8}.h{font-size:18px;font-weight:700}.t{font-size:15px}.m{font-size:14px;fill:#94a3b8}.cap{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.c{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#7dd3fc}.w{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:14px;fill:#e2e8f0}.mid{text-anchor:middle}.end{text-anchor:end}</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#fbbf24"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38bdf8"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2dd4bf"/></marker><symbol id="i-chip" viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="7" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="25" width="14" height="14" rx="3" fill="#2dd4bf"/><path d="M24 6v8M32 6v8M40 6v8M24 50v8M32 50v8M40 50v8M6 24h8M6 32h8M6 40h8M50 24h8M50 32h8M50 40h8" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-server" viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="18" rx="5" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="36" width="44" height="18" rx="5" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="19" r="2.5" fill="#818cf8"/><circle cx="20" cy="45" r="2.5" fill="#818cf8"/><path d="M30 19h16M30 45h16" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-tools" viewBox="0 0 64 64"><path d="M23 22v-4a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v4" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="22" width="48" height="30" rx="6" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 36h48" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="32" width="8" height="9" rx="2" fill="#fb923c"/></symbol><symbol id="i-folder" viewBox="0 0 64 64"><path d="M8 18a3 3 0 0 1 3-3h14l5 6h23a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#cbd5e1" fill-opacity="0.12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 35l6 5-6 5M31 46h10" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 29v-7a12 12 0 0 1 24 0v7" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="29" width="40" height="27" rx="6" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="41" r="4" fill="#fbbf24"/><path d="M32 44v6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-journal" viewBox="0 0 64 64"><rect x="13" y="8" width="38" height="48" rx="5" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 8v48M36 20v24M36 32h7" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="20" r="3.5" fill="#f472b6"/><circle cx="36" cy="32" r="3.5" fill="#f472b6"/><circle cx="36" cy="44" r="3.5" fill="#f472b6"/><circle cx="44" cy="32" r="3.5" fill="#f472b6"/></symbol><symbol id="i-phone" viewBox="0 0 64 64"><rect x="19" y="7" width="26" height="50" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 13h8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="50" r="2.5" fill="#38bdf8"/></symbol></defs>
  <rect x="1" y="1" width="958" height="590" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <text x="48" y="64" class="title" >The core idea</text><text x="48" y="92" class="sub" >A model alone is a mind in a room with no hands. These parts give it a body.</text><rect x="48" y="124" width="180" height="190" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" /><use href="#i-chip" x="106" y="142" width="64" height="64"/><text x="138" y="244" class="h" text-anchor="middle">The mind</text><text x="138" y="270" class="m" text-anchor="middle">Local model (Qwen)</text><text x="138" y="290" class="m" text-anchor="middle">Decides what to do</text><rect x="276" y="124" width="180" height="190" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="2" /><use href="#i-server" x="334" y="142" width="64" height="64"/><text x="366" y="244" class="h" text-anchor="middle">The voice</text><text x="366" y="270" class="m" text-anchor="middle">LM Studio API</text><text x="366" y="290" class="m" text-anchor="middle">127.0.0.1:1234</text><rect x="504" y="124" width="180" height="190" rx="16" fill="#1e293b" stroke="#fb923c" stroke-width="2" /><use href="#i-tools" x="562" y="142" width="64" height="64"/><text x="594" y="244" class="h" text-anchor="middle">The hands</text><text x="594" y="270" class="m" text-anchor="middle">OpenCode</text><text x="594" y="290" class="m" text-anchor="middle">Files, shell, Git</text><rect x="732" y="124" width="180" height="190" rx="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" /><use href="#i-folder" x="790" y="142" width="64" height="64"/><text x="822" y="244" class="h" text-anchor="middle">Your project</text><text x="822" y="270" class="m" text-anchor="middle">Real files on</text><text x="822" y="290" class="m" text-anchor="middle">your Mac</text><line x1="236" y1="219" x2="268" y2="219" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="464" y1="219" x2="496" y2="219" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="692" y1="219" x2="724" y2="219" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="48" y="352" class="cap" >AROUND THE HANDS</text><rect x="48" y="368" width="272" height="144" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2" /><use href="#i-lock" x="64" y="380" width="56" height="56"/><text x="132" y="410" class="h" >Door locks</text><text x="132" y="432" class="m" >= permissions</text><text x="68" y="472" class="t" >Each action is allowed, asked</text><text x="68" y="494" class="t" >about first, or blocked.</text><rect x="344" y="368" width="272" height="144" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="2" /><use href="#i-journal" x="360" y="380" width="56" height="56"/><text x="428" y="410" class="h" >Safety journal</text><text x="428" y="432" class="m" >= Git</text><text x="364" y="472" class="t" >Every change is recorded, so</text><text x="364" y="494" class="t" >you can review and undo it.</text><rect x="640" y="368" width="272" height="144" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" /><use href="#i-phone" x="656" y="380" width="56" height="56"/><text x="724" y="410" class="h" >Remote control</text><text x="724" y="432" class="m" >= pairing</text><text x="660" y="472" class="t" >An iPhone steers the Mac.</text><text x="660" y="494" class="t" >The model never leaves it.</text><text x="480" y="544" class="m" text-anchor="middle">With the local provider selected, prompts and inference stay on your Mac.</text><text x="480" y="566" class="m" text-anchor="middle">GitHub, web requests, and remote pairing still use the internet.</text>
</svg>
