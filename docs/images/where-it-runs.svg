<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Where does the thinking happen?</title>
  <desc id="d">Three setups compared. Local: the model, tools and files are on your Mac. Remote control: an iPhone steers the same Mac, and the model still runs there. Cloud model: inference moves to a provider while tools and files stay on the Mac.</desc>
  <defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e2e8f0}.eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#2dd4bf}.hero{font-size:46px;font-weight:700}.lead{font-size:18px;fill:#cbd5e1}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#94a3b8}.h{font-size:18px;font-weight:700}.t{font-size:15px}.m{font-size:14px;fill:#94a3b8}.cap{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.c{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#7dd3fc}.w{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:14px;fill:#e2e8f0}.mid{text-anchor:middle}.end{text-anchor:end}</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#fbbf24"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38bdf8"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2dd4bf"/></marker><symbol id="i-chip" viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="7" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="25" width="14" height="14" rx="3" fill="#2dd4bf"/><path d="M24 6v8M32 6v8M40 6v8M24 50v8M32 50v8M40 50v8M6 24h8M6 32h8M6 40h8M50 24h8M50 32h8M50 40h8" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-laptop" viewBox="0 0 64 64"><rect x="11" y="13" width="42" height="28" rx="4" fill="#cbd5e1" fill-opacity="0.12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 47h54l-4 7H9z" fill="#cbd5e1" fill-opacity="0.12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-phone" viewBox="0 0 64 64"><rect x="19" y="7" width="26" height="50" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 13h8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="50" r="2.5" fill="#38bdf8"/></symbol><symbol id="i-cloud" viewBox="0 0 64 64"><path d="M19 47a11 11 0 0 1-1-22 15 15 0 0 1 28-3 12 12 0 0 1 1 25z" fill="#94a3b8" fill-opacity="0.15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs>
  <rect x="1" y="1" width="958" height="518" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <text x="48" y="64" class="title" >Where does the thinking happen?</text><text x="48" y="92" class="sub" >Remote control moves the screen, not the model.</text><use href="#i-chip" x="700" y="52" width="30" height="30"/><text x="738" y="73" class="m" >= where the model runs</text><rect x="48" y="124" width="272" height="296" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" /><text x="68" y="162" class="h" >Local (default)</text><text x="68" y="184" class="m" >Qwen served by LM Studio</text><use href="#i-laptop" x="140" y="202" width="88" height="88"/><use href="#i-chip" x="167" y="222" width="34" height="34"/><text x="184" y="302" class="m" text-anchor="middle">Your Mac</text><line x1="68" y1="318" x2="300" y2="318" stroke="#334155" stroke-width="1.5"/><text x="68" y="350" class="m" >Model runs on</text><text x="300" y="350" class="t" text-anchor="end" style="fill:#2dd4bf;font-weight:700">Your Mac</text><text x="68" y="377" class="m" >Tools and files</text><text x="300" y="377" class="t" text-anchor="end" style="fill:#2dd4bf;font-weight:700">Your Mac</text><text x="68" y="404" class="m" >Mac must stay on</text><text x="300" y="404" class="t" text-anchor="end" style="fill:#fbbf24;font-weight:700">Yes</text><rect x="344" y="124" width="272" height="296" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" /><text x="364" y="162" class="h" >Remote control</text><text x="364" y="184" class="m" >An iPhone pairs to your Mac</text><use href="#i-phone" x="364" y="208" width="70" height="70"/><line x1="436" y1="254" x2="492" y2="254" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" marker-start="url(#ar-sky)" marker-end="url(#ar-sky)"/><text x="464" y="242" class="m" text-anchor="middle">tunnel</text><use href="#i-laptop" x="500" y="202" width="88" height="88"/><use href="#i-chip" x="527" y="222" width="34" height="34"/><text x="399" y="302" class="m" text-anchor="middle">iPhone</text><text x="544" y="302" class="m" text-anchor="middle">Your Mac</text><line x1="364" y1="318" x2="596" y2="318" stroke="#334155" stroke-width="1.5"/><text x="364" y="350" class="m" >Model runs on</text><text x="596" y="350" class="t" text-anchor="end" style="fill:#2dd4bf;font-weight:700">Your Mac</text><text x="364" y="377" class="m" >Tools and files</text><text x="596" y="377" class="t" text-anchor="end" style="fill:#2dd4bf;font-weight:700">Your Mac</text><text x="364" y="404" class="m" >Mac must stay on</text><text x="596" y="404" class="t" text-anchor="end" style="fill:#fbbf24;font-weight:700">Yes</text><rect x="640" y="124" width="272" height="296" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" /><text x="660" y="162" class="h" >Cloud model</text><text x="660" y="184" class="m" >Hosted model, local tools</text><use href="#i-laptop" x="654" y="214" width="80" height="80"/><line x1="736" y1="254" x2="790" y2="254" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" marker-start="url(#ar)" marker-end="url(#ar)"/><use href="#i-cloud" x="796" y="202" width="88" height="88"/><use href="#i-chip" x="824" y="224" width="32" height="32"/><text x="694" y="302" class="m" text-anchor="middle">Your Mac</text><text x="840" y="302" class="m" text-anchor="middle">Provider</text><line x1="660" y1="318" x2="892" y2="318" stroke="#334155" stroke-width="1.5"/><text x="660" y="350" class="m" >Model runs on</text><text x="892" y="350" class="t" text-anchor="end" style="fill:#38bdf8;font-weight:700">Provider</text><text x="660" y="377" class="m" >Tools and files</text><text x="892" y="377" class="t" text-anchor="end" style="fill:#2dd4bf;font-weight:700">Your Mac</text><text x="660" y="404" class="m" >Mac must stay on</text><text x="892" y="404" class="t" text-anchor="end" style="fill:#fbbf24;font-weight:700">Yes</text><rect x="48" y="440" width="864" height="56" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/><text x="68" y="464" class="t" >A true cloud agent runs OpenCode and the model on an always-on machine.</text><text x="68" y="485" class="m" >Pairing alone does not do that. It only lets another device steer your Mac.</text>
</svg>
