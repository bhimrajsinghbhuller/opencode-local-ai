<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" width="960" height="288" role="img" aria-labelledby="t d">
  <title id="t">OpenCode plus Local AI</title>
  <desc id="d">A Mac running a local model, LM Studio, and OpenCode connected in a row, with badges for Apple Silicon macOS, no API key, localhost, and the MIT license.</desc>
  <defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e2e8f0}.eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#2dd4bf}.hero{font-size:46px;font-weight:700}.lead{font-size:18px;fill:#cbd5e1}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#94a3b8}.h{font-size:18px;font-weight:700}.t{font-size:15px}.m{font-size:14px;fill:#94a3b8}.cap{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.c{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#7dd3fc}.w{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:14px;fill:#e2e8f0}.mid{text-anchor:middle}.end{text-anchor:end}</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#fbbf24"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38bdf8"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2dd4bf"/></marker><symbol id="i-chip" viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="7" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="25" width="14" height="14" rx="3" fill="#2dd4bf"/><path d="M24 6v8M32 6v8M40 6v8M24 50v8M32 50v8M40 50v8M6 24h8M6 32h8M6 40h8M50 24h8M50 32h8M50 40h8" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-server" viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="18" rx="5" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="36" width="44" height="18" rx="5" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="19" r="2.5" fill="#818cf8"/><circle cx="20" cy="45" r="2.5" fill="#818cf8"/><path d="M30 19h16M30 45h16" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-tools" viewBox="0 0 64 64"><path d="M23 22v-4a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v4" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="22" width="48" height="30" rx="6" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 36h48" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="32" width="8" height="9" rx="2" fill="#fb923c"/></symbol></defs>
  <rect x="1" y="1" width="958" height="286" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <radialGradient id="g1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#818cf8" stop-opacity="0.16"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient><clipPath id="card"><rect x="1" y="1" width="958" height="286" rx="20"/></clipPath><g clip-path="url(#card)"><circle cx="840" cy="60" r="300" fill="url(#g1)"/><circle cx="40" cy="308" r="260" fill="url(#g2)"/></g>
  <text x="48" y="72" class="eyebrow" >LOCAL-FIRST CODING AGENT</text><text x="48" y="130" class="hero" >OpenCode + Local AI</text><text x="48" y="170" class="lead" >Run a model on your own Mac with LM Studio, then let</text><text x="48" y="196" class="lead" >OpenCode give it hands: files, shell, Git, and GitHub.</text><rect x="48" y="232" width="192" height="32" rx="16" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" /><text x="144.0" y="253" class="t" text-anchor="middle">Apple Silicon macOS</text><rect x="252" y="232" width="112" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" /><text x="308.0" y="253" class="t" text-anchor="middle">No API key</text><rect x="376" y="232" width="168" height="32" rx="16" fill="#0f172a" stroke="#fb923c" stroke-width="1.5" /><text x="460.0" y="253" class="t" text-anchor="middle">Runs on localhost</text><rect x="556" y="232" width="56" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" /><text x="584.0" y="253" class="t" text-anchor="middle">MIT</text><rect x="622" y="36" width="288" height="160" rx="12" fill="#111c33" stroke="#475569" stroke-width="3" /><rect x="596" y="202" width="340" height="14" rx="7" fill="#1e293b" stroke="#475569" stroke-width="2" /><rect x="736" y="202" width="60" height="6" rx="3" fill="#334155"/><use href="#i-chip" x="640" y="66" width="58" height="58"/><use href="#i-server" x="737" y="66" width="58" height="58"/><use href="#i-tools" x="834" y="66" width="58" height="58"/><line x1="702" y1="95" x2="732" y2="95" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="799" y1="95" x2="829" y2="95" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="669" y="146" class="m" text-anchor="middle">Local model</text><text x="766" y="146" class="m" text-anchor="middle">LM Studio</text><text x="863" y="146" class="m" text-anchor="middle">OpenCode</text>