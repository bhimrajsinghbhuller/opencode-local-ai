<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="t d">
  <title id="t">How one request becomes work</title>
  <desc id="d">Six steps in a loop: you set a goal, OpenCode asks the model, the model decides, a permission check runs, the tool runs, and the result goes back to the model until the task is done.</desc>
  <defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e2e8f0}.eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#2dd4bf}.hero{font-size:46px;font-weight:700}.lead{font-size:18px;fill:#cbd5e1}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#94a3b8}.h{font-size:18px;font-weight:700}.t{font-size:15px}.m{font-size:14px;fill:#94a3b8}.cap{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.c{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#7dd3fc}.w{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:14px;fill:#e2e8f0}.mid{text-anchor:middle}.end{text-anchor:end}</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#fbbf24"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38bdf8"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2dd4bf"/></marker></defs>
  <rect x="1" y="1" width="958" height="446" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <text x="48" y="64" class="title" >How one request becomes work</text><text x="48" y="92" class="sub" >This loop is what separates a coding agent from a chatbot.</text><rect x="48" y="120" width="256" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" /><circle cx="78" cy="152" r="16" fill="#38bdf8"/><text x="78" y="158" class="h" text-anchor="middle" style="fill:#0f172a">1</text><text x="106" y="158" class="h" >You set a goal</text><text x="68" y="186" class="m" >Open a project and</text><text x="68" y="205" class="m" >describe the outcome.</text><rect x="352" y="120" width="256" height="100" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2" /><circle cx="382" cy="152" r="16" fill="#818cf8"/><text x="382" y="158" class="h" text-anchor="middle" style="fill:#0f172a">2</text><text x="410" y="158" class="h" >OpenCode asks</text><text x="372" y="186" class="m" >Sends the goal, context,</text><text x="372" y="205" class="m" >and tools to LM Studio.</text><rect x="656" y="120" width="256" height="100" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" /><circle cx="686" cy="152" r="16" fill="#2dd4bf"/><text x="686" y="158" class="h" text-anchor="middle" style="fill:#0f172a">3</text><text x="714" y="158" class="h" >Model decides</text><text x="676" y="186" class="m" >It answers you, or asks</text><text x="676" y="205" class="m" >to use a tool.</text><rect x="656" y="290" width="256" height="100" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2" /><circle cx="686" cy="322" r="16" fill="#fbbf24"/><text x="686" y="328" class="h" text-anchor="middle" style="fill:#0f172a">4</text><text x="714" y="328" class="h" >Permission check</text><text x="676" y="356" class="m" >Allow, ask, or deny,</text><text x="676" y="375" class="m" >set by your policy.</text><rect x="352" y="290" width="256" height="100" rx="14" fill="#1e293b" stroke="#fb923c" stroke-width="2" /><circle cx="382" cy="322" r="16" fill="#fb923c"/><text x="382" y="328" class="h" text-anchor="middle" style="fill:#0f172a">5</text><text x="410" y="328" class="h" >The tool runs</text><text x="372" y="356" class="m" >Edit a file, run tests,</text><text x="372" y="375" class="m" >call Git or the shell.</text><rect x="48" y="290" width="256" height="100" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" /><circle cx="78" cy="322" r="16" fill="#2dd4bf"/><text x="78" y="328" class="h" text-anchor="middle" style="fill:#0f172a">6</text><text x="106" y="328" class="h" >Result goes back</text><text x="68" y="356" class="m" >The model reads the output</text><text x="68" y="375" class="m" >and picks the next step.</text><line x1="306" y1="170" x2="348" y2="170" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="610" y1="170" x2="652" y2="170" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="784" y1="222" x2="784" y2="286" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-amber)"/><line x1="650" y1="340" x2="614" y2="340" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="346" y1="340" x2="310" y2="340" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><path d="M176 288V256H480V224" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-teal)"/><text x="328" y="246" class="m" text-anchor="middle" style="fill:#2dd4bf">repeat until the task is done</text><text x="480" y="424" class="m" text-anchor="middle">The loop runs on your Mac. A tool call can still reach the internet if your policy allows it.</text>
</svg>
