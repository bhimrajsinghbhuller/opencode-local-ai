<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="t d">
  <title id="t">Permissions are the door locks</title>
  <desc id="d">The safe template allows reading, editing, searching and shell commands, asks before touching folders outside the project or pushing with git, and denies sudo and rm -rf. The unrestricted template allows everything.</desc>
  <defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e2e8f0}.eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#2dd4bf}.hero{font-size:46px;font-weight:700}.lead{font-size:18px;fill:#cbd5e1}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#94a3b8}.h{font-size:18px;font-weight:700}.t{font-size:15px}.m{font-size:14px;fill:#94a3b8}.cap{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.c{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#7dd3fc}.w{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:14px;fill:#e2e8f0}.mid{text-anchor:middle}.end{text-anchor:end}</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#fbbf24"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38bdf8"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2dd4bf"/></marker></defs>
  <rect x="1" y="1" width="958" height="482" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <text x="48" y="64" class="title" >Permissions are the door locks</text><text x="48" y="92" class="sub" >What the safe template does, and what the unrestricted template removes.</text><rect x="48" y="124" width="192" height="244" rx="16" fill="#1e293b" stroke="#4ade80" stroke-width="2" /><path d="M48 140a16 16 0 0 1 16-16h160a16 16 0 0 1 16 16v38H48z" fill="#4ade80" fill-opacity="0.16"/><text x="66" y="150" class="h" style="fill:#4ade80">ALLOW</text><text x="66" y="169" class="m" >runs without asking</text><rect x="62" y="190" width="164" height="34" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.6"/><text x="144" y="212" class="t" text-anchor="middle">Read files</text><rect x="62" y="232" width="164" height="34" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.6"/><text x="144" y="254" class="t" text-anchor="middle">Edit files</text><rect x="62" y="274" width="164" height="34" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.6"/><text x="144" y="296" class="t" text-anchor="middle">Search (glob, grep)</text><rect x="62" y="316" width="164" height="34" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.6"/><text x="144" y="338" class="t" text-anchor="middle">Run shell commands</text><rect x="252" y="124" width="192" height="244" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2" /><path d="M252 140a16 16 0 0 1 16-16h160a16 16 0 0 1 16 16v38H252z" fill="#fbbf24" fill-opacity="0.16"/><text x="270" y="150" class="h" style="fill:#fbbf24">ASK</text><text x="270" y="169" class="m" >pauses for your OK</text><rect x="266" y="190" width="164" height="34" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/><text x="348" y="212" class="t" text-anchor="middle">Outside project</text><rect x="266" y="232" width="164" height="34" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/><text x="348" y="254" class="w" text-anchor="middle">git push</text><rect x="456" y="124" width="192" height="244" rx="16" fill="#1e293b" stroke="#f87171" stroke-width="2" /><path d="M456 140a16 16 0 0 1 16-16h160a16 16 0 0 1 16 16v38H456z" fill="#f87171" fill-opacity="0.16"/><text x="474" y="150" class="h" style="fill:#f87171">DENY</text><text x="474" y="169" class="m" >always refused</text><rect x="470" y="190" width="164" height="34" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.6"/><text x="552" y="212" class="w" text-anchor="middle">sudo</text><rect x="470" y="232" width="164" height="34" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.6"/><text x="552" y="254" class="w" text-anchor="middle">rm -rf</text><text x="660" y="250" class="m" text-anchor="middle">or</text><rect x="672" y="124" width="240" height="244" rx="16" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="7 6"/><text x="692" y="156" class="h" style="fill:#f87171">UNRESTRICTED</text><text x="692" y="188" class="h" >Allow everything</text><text x="692" y="218" class="t" >No approval prompts.</text><text x="692" y="240" class="t" >No configured blocks.</text><text x="692" y="262" class="t" >Same reach as your</text><text x="692" y="284" class="t" >macOS account.</text><rect x="692" y="316" width="200" height="32" rx="16" fill="#0f172a" stroke="#f87171" stroke-width="1.5" /><text x="792" y="337" class="t" text-anchor="middle">Trusted repos only</text><text x="48" y="404" class="m" >Rules are read in order and the last match wins. The specific ask and deny rules</text><text x="48" y="424" class="m" >come after the broad allow, so they override it.</text><text x="48" y="454" class="t" style="fill:#fbbf24">Pattern rules are not a sandbox. Pair them with Git, backups, and a clean working tree.</text>
</svg>
