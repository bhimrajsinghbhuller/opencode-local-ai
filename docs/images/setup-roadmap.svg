<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">Setup roadmap</title>
  <desc id="d">Six steps: install LM Studio, download models, start the server, install OpenCode, apply the config, and verify the exact reply LOCAL_QWEN_OK. GitHub access and iPhone remote control are optional extras.</desc>
  <defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e2e8f0}.eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#2dd4bf}.hero{font-size:46px;font-weight:700}.lead{font-size:18px;fill:#cbd5e1}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#94a3b8}.h{font-size:18px;font-weight:700}.t{font-size:15px}.m{font-size:14px;fill:#94a3b8}.cap{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.c{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#7dd3fc}.w{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:14px;fill:#e2e8f0}.mid{text-anchor:middle}.end{text-anchor:end}</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#fbbf24"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38bdf8"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2dd4bf"/></marker></defs>
  <rect x="1" y="1" width="958" height="478" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <text x="48" y="64" class="title" >Setup roadmap</text><text x="48" y="92" class="sub" >Prefer one command? ./scripts/bootstrap-macos.sh runs steps 1 to 6 for you.</text><rect x="48" y="124" width="272" height="108" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" /><circle cx="78" cy="156" r="16" fill="#818cf8"/><text x="78" y="162" class="h" text-anchor="middle" style="fill:#0f172a">1</text><text x="106" y="162" class="h" >Install LM Studio</text><text x="66" y="188" class="m" >Then open it once.</text><rect x="62" y="198" width="244" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="72" y="216" class="c" >brew install --cask lm-studio</text><line x1="322" y1="178" x2="342" y2="178" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="344" y="124" width="272" height="108" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" /><circle cx="374" cy="156" r="16" fill="#818cf8"/><text x="374" y="162" class="h" text-anchor="middle" style="fill:#0f172a">2</text><text x="402" y="162" class="h" >Download models</text><text x="362" y="188" class="m" >About 26 GB for all three.</text><rect x="358" y="198" width="244" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="368" y="216" class="c" >lms get qwen/qwen3.5-9b</text><line x1="618" y1="178" x2="638" y2="178" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640" y="124" width="272" height="108" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" /><circle cx="670" cy="156" r="16" fill="#818cf8"/><text x="670" y="162" class="h" text-anchor="middle" style="fill:#0f172a">3</text><text x="698" y="162" class="h" >Start the server</text><text x="658" y="188" class="m" >Localhost only, port 1234.</text><rect x="654" y="198" width="244" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="664" y="216" class="c" >lms server start</text><rect x="48" y="252" width="272" height="108" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" /><circle cx="78" cy="284" r="16" fill="#fb923c"/><text x="78" y="290" class="h" text-anchor="middle" style="fill:#0f172a">4</text><text x="106" y="290" class="h" >Install OpenCode</text><text x="66" y="316" class="m" >Official installer.</text><rect x="62" y="326" width="244" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="72" y="344" class="c" >opencode --version</text><line x1="322" y1="306" x2="342" y2="306" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="344" y="252" width="272" height="108" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" /><circle cx="374" cy="284" r="16" fill="#fb923c"/><text x="374" y="290" class="h" text-anchor="middle" style="fill:#0f172a">5</text><text x="402" y="290" class="h" >Apply the config</text><text x="362" y="316" class="m" >Safe template by default.</text><rect x="358" y="326" width="244" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="368" y="344" class="c" >opencode debug config</text><line x1="618" y1="306" x2="638" y2="306" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640" y="252" width="272" height="108" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" /><circle cx="670" cy="284" r="16" fill="#4ade80"/><text x="670" y="290" class="h" text-anchor="middle" style="fill:#0f172a">6</text><text x="698" y="290" class="h" >Prove it works</text><text x="658" y="316" class="m" >Expect this exact reply.</text><rect x="654" y="326" width="244" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="664" y="344" class="c" >LOCAL_QWEN_OK</text><rect x="48" y="392" width="420" height="60" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/><text x="68" y="418" class="t" >Optional: GitHub access</text><text x="68" y="440" class="c" >gh auth login</text><rect x="492" y="392" width="420" height="60" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/><text x="512" y="418" class="t" >Optional: iPhone remote control</text><text x="512" y="440" class="c" >opencode pair --remote</text>
</svg>
